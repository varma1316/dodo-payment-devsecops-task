<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Ledger API DevSecOps architecture</title>
  <desc id="desc">A secure delivery pipeline feeds an ArgoCD-managed Kubernetes payments namespace. Kyverno and Pod Security provide admission controls. Istio strict mTLS and Kubernetes NetworkPolicy allow reporting to reach ledger-api and block intruder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8f3f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16313a" flood-opacity=".14"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#087e8b"/></marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3d5960"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c2413a"/></marker>
    <style>
      .heading { font-family: Georgia, serif; fill: #17333a; }
      .label { font-family: Arial, sans-serif; fill: #17333a; font-weight: 700; }
      .body { font-family: Arial, sans-serif; fill: #47636b; }
      .small { font-family: Arial, sans-serif; fill: #587178; font-size: 15px; }
      .box { filter: url(#shadow); stroke-width: 1.5px; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect x="40" y="32" width="10" height="60" rx="5" fill="#f0a202"/>
  <text x="70" y="62" class="heading" font-size="34" font-weight="700">Ledger API: Secure Delivery and Zero-Trust Runtime</text>
  <text x="70" y="88" class="body" font-size="17">Dodo Payments DevSecOps assessment · local kind cluster · GitOps as the source of truth</text>

  <!-- Delivery lane -->
  <text x="70" y="151" class="label" font-size="18">1. Secure delivery</text>
  <rect class="box" x="70" y="177" width="205" height="112" rx="16" fill="#ffffff" stroke="#b8c9cd"/>
  <text x="172" y="219" text-anchor="middle" class="label" font-size="20">Developer</text>
  <text x="172" y="247" text-anchor="middle" class="body" font-size="15">code + manifests</text>
  <text x="172" y="268" text-anchor="middle" class="body" font-size="15">push to GitHub</text>

  <rect class="box" x="355" y="177" width="265" height="112" rx="16" fill="#e5f6f5" stroke="#62aaa9"/>
  <text x="487" y="214" text-anchor="middle" class="label" font-size="20">GitHub Actions</text>
  <text x="487" y="242" text-anchor="middle" class="body" font-size="15">Semgrep · Gitleaks · Trivy</text>
  <text x="487" y="264" text-anchor="middle" class="body" font-size="15">build · SBOM · Cosign attest</text>

  <rect class="box" x="700" y="177" width="230" height="112" rx="16" fill="#fff3dc" stroke="#e6ad4f"/>
  <text x="815" y="219" text-anchor="middle" class="label" font-size="20">GHCR Image</text>
  <text x="815" y="247" text-anchor="middle" class="body" font-size="15">digest-pinned image</text>
  <text x="815" y="268" text-anchor="middle" class="body" font-size="15">keyless signature</text>

  <rect class="box" x="1010" y="177" width="250" height="112" rx="16" fill="#ffffff" stroke="#b8c9cd"/>
  <text x="1135" y="219" text-anchor="middle" class="label" font-size="20">GitOps Repository</text>
  <text x="1135" y="247" text-anchor="middle" class="body" font-size="15">Kustomize production</text>
  <text x="1135" y="268" text-anchor="middle" class="body" font-size="15">desired state</text>

  <path d="M275 233 H355" stroke="#087e8b" stroke-width="4" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M620 233 H700" stroke="#087e8b" stroke-width="4" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M930 233 H1010" stroke="#087e8b" stroke-width="4" fill="none" marker-end="url(#arrow-teal)"/>

  <!-- Cluster -->
  <text x="70" y="358" class="label" font-size="18">2. Runtime controls in the kind cluster</text>
  <rect x="70" y="382" width="1460" height="472" rx="24" fill="#ffffff" stroke="#91afb6" stroke-width="2"/>
  <text x="106" y="423" class="label" font-size="20">Kubernetes cluster</text>
  <text x="106" y="448" class="small">ArgoCD continuously syncs Git desired state and self-heals drift.</text>

  <rect class="box" x="1230" y="405" width="230" height="92" rx="14" fill="#e5f6f5" stroke="#62aaa9"/>
  <text x="1345" y="442" text-anchor="middle" class="label" font-size="19">ArgoCD</text>
  <text x="1345" y="468" text-anchor="middle" class="body" font-size="15">sync · prune · self-heal</text>
  <path d="M1135 289 V348 H1345 V405" stroke="#087e8b" stroke-width="4" fill="none" marker-end="url(#arrow-teal)"/>

  <rect x="108" y="490" width="260" height="308" rx="18" fill="#fff8e9" stroke="#e6ad4f" stroke-width="1.5"/>
  <text x="238" y="528" text-anchor="middle" class="label" font-size="20">Admission boundary</text>
  <text x="238" y="558" text-anchor="middle" class="body" font-size="15">Pod Security Admission</text>
  <text x="238" y="583" text-anchor="middle" class="body" font-size="15">Kyverno guardrails</text>
  <line x1="144" y1="610" x2="332" y2="610" stroke="#e6ad4f" stroke-width="1"/>
  <text x="238" y="642" text-anchor="middle" class="small">non-root + seccomp</text>
  <text x="238" y="668" text-anchor="middle" class="small">no latest tag</text>
  <text x="238" y="694" text-anchor="middle" class="small">signed ledger image</text>
  <text x="238" y="744" text-anchor="middle" class="body" font-size="15">reject insecure manifests</text>

  <rect x="420" y="490" width="1045" height="308" rx="18" fill="#f4fbfb" stroke="#62aaa9" stroke-width="1.5"/>
  <text x="450" y="528" class="label" font-size="20">payments namespace</text>
  <text x="450" y="554" class="small">Strict mTLS + AuthorizationPolicy on top of default-deny Kubernetes NetworkPolicy.</text>

  <rect class="box" x="474" y="610" width="210" height="105" rx="15" fill="#ffffff" stroke="#74a7bd"/>
  <text x="579" y="648" text-anchor="middle" class="label" font-size="19">reporting</text>
  <text x="579" y="674" text-anchor="middle" class="body" font-size="14">service account identity</text>
  <text x="579" y="696" text-anchor="middle" class="body" font-size="14">allowed caller</text>

  <rect class="box" x="833" y="591" width="260" height="143" rx="15" fill="#dff4ef" stroke="#2c9389" stroke-width="2"/>
  <text x="963" y="632" text-anchor="middle" class="label" font-size="21">ledger-api</text>
  <text x="963" y="659" text-anchor="middle" class="body" font-size="14">non-root · read-only rootfs</text>
  <text x="963" y="681" text-anchor="middle" class="body" font-size="14">resources · probes · RBAC</text>
  <text x="963" y="708" text-anchor="middle" class="body" font-size="14">encrypted secret input</text>

  <rect class="box" x="1215" y="610" width="190" height="105" rx="15" fill="#fff0ee" stroke="#c2413a"/>
  <text x="1310" y="648" text-anchor="middle" class="label" font-size="19">intruder</text>
  <text x="1310" y="674" text-anchor="middle" class="body" font-size="14">wrong workload identity</text>
  <text x="1310" y="696" text-anchor="middle" class="body" font-size="14">blocked caller</text>

  <path d="M684 662 H833" stroke="#087e8b" stroke-width="5" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="758" y="644" text-anchor="middle" class="small">mTLS + explicit allow</text>
  <path d="M1215 662 H1093" stroke="#c2413a" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <line x1="1142" y1="634" x2="1172" y2="690" stroke="#c2413a" stroke-width="5"/>
  <line x1="1172" y1="634" x2="1142" y2="690" stroke="#c2413a" stroke-width="5"/>
  <text x="1155" y="620" text-anchor="middle" class="small">default deny</text>

  <!-- Footer -->
  <rect x="70" y="877" width="1460" height="1" fill="#b8c9cd"/>
  <text x="70" y="911" class="small">Evidence to demonstrate: policy rejection · signed delivery · ArgoCD self-heal · STRICT mTLS · reporting 200 / intruder 000.</text>
</svg>
