name: ci-cd

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ledger-api
  GITLEAKS_VERSION: 8.24.3

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config=p/default --error --json --output semgrep.json app/

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts=-1

      - name: Upload Gitleaks SARIF artifact
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks.sarif

      - name: Run filesystem Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  build-sign-and-promote:
    if: github.ref == 'refs/heads/main'
    needs: security-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes $IMAGE_NAME@${{ steps.build.outputs.digest }}

      - name: Generate provenance attestation
        run: |
          cosign attest \
            --yes \
            --predicate <(printf '{"buildType":"github-actions","builder":"%s","commit":"%s"}' "${{ github.workflow }}" "${{ github.sha }}") \
            --type slsaprovenance \
            $IMAGE_NAME@${{ steps.build.outputs.digest }}
        shell: bash

      - name: Update GitOps image digest
        run: |
          sed -i "s|newName: .*|newName: $IMAGE_NAME|" k8s/overlays/prod/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|" k8s/overlays/prod/kustomization.yaml

      - name: Commit GitOps change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: promote image ${{ github.sha }}"
